<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Passo a passo para instalar no Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0b2a1c"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#86efac"/></linearGradient>
  </defs>
  <rect width="720" height="420" rx="34" fill="url(#bg)"/>
  <rect x="36" y="36" width="648" height="348" rx="30" fill="#0b1119" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="66" y="82" fill="#86efac" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">ANDROID</text>
  <text x="66" y="120" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="900">Instale pela tela inicial</text>
  <g transform="translate(70 155)">
    <rect width="170" height="175" rx="24" fill="#111827" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="85" cy="55" r="28" fill="#22c55e" opacity="0.18"/>
