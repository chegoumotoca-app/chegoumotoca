    <text x="24" y="112" fill="#ffffff" font-family="Arial" font-size="18" font-weight="800">Abra no Chrome</text>
    <text x="24" y="140" fill="#cbd5e1" font-family="Arial" font-size="14">Entre no site do</text>
    <text x="24" y="160" fill="#cbd5e1" font-family="Arial" font-size="14">Chegou Motoca</text>
  </g>
  <g transform="translate(276 155)">
    <rect width="170" height="175" rx="24" fill="#111827" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="85" cy="55" r="28" fill="#22c55e" opacity="0.18"/>
    <text x="85" y="64" fill="#86efac" font-family="Arial" font-size="34" text-anchor="middle">2</text>
    <text x="24" y="112" fill="#ffffff" font-family="Arial" font-size="18" font-weight="800">Toque em Instalar</text>
    <rect x="24" y="132" width="122" height="28" rx="14" fill="url(#btn)"/>
    <text x="85" y="151" fill="#052e16" font-family="Arial" font-size="13" font-weight="900" text-anchor="middle">Instalar app</text>
  </g>
  <g transform="translate(482 155)">
    <rect width="170" height="175" rx="24" fill="#111827" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="85" cy="55" r="28" fill="#22c55e" opacity="0.18"/>
    <text x="85" y="64" fill="#86efac" font-family="Arial" font-size="34" text-anchor="middle">3</text>
    <text x="24" y="112" fill="#ffffff" font-family="Arial" font-size="18" font-weight="800">Confirme</text>
    <text x="24" y="140" fill="#cbd5e1" font-family="Arial" font-size="14">O ícone aparece na</text>
    <text x="24" y="160" fill="#cbd5e1" font-family="Arial" font-size="14">tela inicial</text>
